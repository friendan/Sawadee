<html theme="chrome" size="1280,800" caption="0,0,0,40" min-size="960,600" size-box="4,4,6,6">
  <VBox name="root" window-resize="all">
    <TitleBar name="titlebar" title="" height="40"
        show-min="true" show-max="true" show-close="true" action="title">
      <Button name="btn_nav_toggle" kind="none" lucide="menu" width="36" height="40"
          tooltip="隐藏功能菜单" />
      <Label name="titlebar_app" text="Sawadee" font-size="13" mouse="false"
          color="var(--color-titlebar-text)" />
      <Spacer />
      <ThemeSwitcher name="themeSwitch" width="36" height="40"
          tooltip="选择主题" margin="0,8,0,0" />
      <Button name="btn_image" kind="none" lucide="image" width="36" height="40"
          tooltip="图片" margin="0,8,0,0" />
    </TitleBar>

    <HBox name="content" flexible="1">
      <VBox name="nav_panel" width="280" theme="panel" border="0,0,1,0"
          padding="12,14,12,10" gap="6">
        <Button name="nav_menu" kind="none"
            text="<c var(--color-success)>เ</c><c var(--color-primary)>ม</c><c var(--color-primary)>น</c><c var(--color-success)>ู</c>"
            height="34" padding="0,14,0,6" text-align="left" showhtml="true"
            font-family="TH Sarabun New" font-size="24"
            color="var(--color-text-secondary)" tooltip="功能" cursor="pointer" />
        <Option name="nav_consonant" group="main_nav"
            text="<c var(--color-primary)>พ</c><c var(--color-primary)>ย</c><c var(--color-success)>ั</c><c var(--color-primary)>ญ</c><c var(--color-primary)>ช</c><c var(--color-primary)>น</c><c var(--color-success)>ะ</c>"
            selected="true" tooltip="辅音" lucide="type" />
        <Option name="nav_vowel" group="main_nav"
            text="<c var(--color-primary)>ส</c><c var(--color-primary)>ร</c><c var(--color-success)>ะ</c>"
            tooltip="元音" lucide="whole-word" />
        <Option name="nav_tone" group="main_nav"
            text="<c var(--color-primary)>ว</c><c var(--color-primary)>ร</c><c var(--color-primary)>ร</c><c var(--color-primary)>ณ</c><c var(--color-primary)>ย</c><c var(--color-success)>ุ</c><c var(--color-primary)>ก</c>์<c var(--color-primary)>ต</c>"
            tooltip="声调" lucide="audio-lines" />
        <Option name="nav_lesson" group="main_nav"
            text="<c var(--color-primary)>ค</c><c var(--color-success)>ำ</c><c var(--color-primary)>ศ</c><c var(--color-success)>ั</c><c var(--color-primary)>พ</c><c var(--color-primary)>ท</c><c var(--color-success)>์</c>"
            tooltip="单词" lucide="book-open" />
        <Option name="nav_practice" group="main_nav"
            text="<c var(--color-primary)>ป</c><c var(--color-primary)>ร</c><c var(--color-success)>ะ</c><c var(--color-success)>โ</c><c var(--color-primary)>ย</c><c var(--color-primary)>ค</c>"
            tooltip="句子" lucide="message-square" />
        <Spacer />
      </VBox>

      <TabLayout name="pages" flexible="1" selected-id="0">
        <VBox name="page_consonant" padding="20,20,20,16">
          <VBox name="consonant_body" flexible="1" overflow-y="auto" gap="8" />
        </VBox>
        <VBox name="page_vowel" padding="20,20,20,16">
          <VBox name="vowel_body" flexible="1" overflow-y="auto" gap="8" />
        </VBox>
        <VBox name="page_tone" padding="20,20,20,16">
          <VBox name="tone_body" flexible="1" overflow-y="auto" gap="8" />
        </VBox>
        <VBox name="page_vocab" padding="24,24,24,24" gap="8">
          <Label text="词汇" font-size="20" font-weight="bold" height="32"
              color="var(--color-text)" />
          <Label text="常用词汇" theme="secondary" />
        </VBox>
        <VBox name="page_lesson" padding="16,16,12,16" gap="8">
          <Edit name="edt_word" height="36" placeholder="搜索泰语或中文" />
          <HBox height="28" padding="0,16,0,16" align-items="vcenter">
            <Label text="序号" width="64" theme="secondary" />
            <Label text="泰语" width="560" theme="secondary" />
            <Label text="中文" theme="secondary" />
          </HBox>
          <VirtualList name="word_list" flexible="1" item-height="88" />
        </VBox>
        <VBox name="page_practice" padding="16,16,12,16" gap="8">
          <Edit name="edt_sentence" height="36" placeholder="搜索泰语或中文" />
          <HBox height="28" padding="0,16,0,16" align-items="vcenter">
            <Label text="序号" width="64" theme="secondary" />
            <Label text="泰语" flexible="1" theme="secondary" />
            <Label text="中文" width="280" theme="secondary" />
          </HBox>
          <VirtualList name="sentence_list" flexible="1" item-height="88" />
        </VBox>
      </TabLayout>
    </HBox>

    <Control name="status_sep" height="1" background-color="var(--color-border)" />

    <HBox name="statusbar" height="28" padding="0,12,0,12" gap="8" align-items="vcenter">
      <Label name="status_message" theme="secondary" text="辅音" />
      <Spacer />
    </HBox>
  </VBox>
</html>
<style>
  #nav_consonant,
  #nav_vowel,
  #nav_tone,
  #nav_lesson,
  #nav_practice {
    height: 84;
    kind: none;
    showhtml: true;
    text-align: left;
    font-family: TH Sarabun New;
    font-size: 50;
    padding: 0,16,0,14;
    icon-gap: 14;
    icon-size: 20;
    border-radius: 8;
    color: var(--color-text);
  }
  #nav_consonant:hover,
  #nav_vowel:hover,
  #nav_tone:hover,
  #nav_lesson:hover,
  #nav_practice:hover {
    color: var(--color-primary);
    background-color: var(--color-bg-hover-medium);
  }
  #nav_consonant:checked,
  #nav_vowel:checked,
  #nav_tone:checked,
  #nav_lesson:checked,
  #nav_practice:checked {
    color: var(--color-primary);
    background-color: var(--color-selection);
  }
</style>
